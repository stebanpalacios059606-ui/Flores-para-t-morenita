<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Para Beatriz 🌎🌻</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
    font-family:Georgia,"Times New Roman",serif;
}


/* =================================
   ENTRADA
================================= */

#start{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;

    transition:opacity 2s ease;
}

#start.hidden{
    opacity:0;
    pointer-events:none;
}

.enter{
    color:#fff7c4;

    text-align:center;

    font-size:
        clamp(42px,12vw,82px);

    font-weight:bold;

    line-height:1.15;

    letter-spacing:8px;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #ffd83d,
        0 0 55px #ff9d00;

    animation:pulse 2.5s infinite;
}

.enter span{
    display:block;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
        opacity:.7;
    }

    50%{
        transform:scale(1.08);
        opacity:1;
    }

}


/* =================================
   UNIVERSO
================================= */

#space{
    position:fixed;
    inset:0;

    overflow:hidden;

    opacity:0;

    background:
        radial-gradient(
            circle at 50% 50%,
            #351067 0%,
            #16082e 30%,
            #05020e 65%,
            #000 100%
        );

    transition:opacity 4s;
}

#space.show{
    opacity:1;
}


/* =================================
   ESCENA COMPLETA
================================= */

#scene{
    position:absolute;

    left:50%;
    top:50%;

    width:100vw;
    height:100vh;

    transform:
        translate(-50%,-50%)
        rotateX(0deg)
        rotateY(0deg)
        scale(1);

    transform-style:preserve-3d;

    perspective:1200px;

    will-change:transform;
}


/* =================================
   NEBULOSA
================================= */

.nebula{
    position:absolute;

    left:50%;
    top:50%;

    width:120vw;
    height:90vw;

    max-width:1300px;
    max-height:900px;

    transform:
        translate(-50%,-50%)
        translateZ(-700px);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,170,40,.28) 0%,
            rgba(190,60,255,.25) 25%,
            rgba(50,100,255,.18) 48%,
            rgba(255,40,160,.10) 60%,
            transparent 75%
        );

    filter:blur(35px);

    animation:nebula 15s infinite alternate ease-in-out;
}

@keyframes nebula{

    from{
        transform:
            translate(-53%,-48%)
            translateZ(-700px)
            rotate(-7deg)
            scale(.9);
    }

    to{
        transform:
            translate(-47%,-52%)
            translateZ(-700px)
            rotate(7deg)
            scale(1.15);
    }

}


/* =================================
   ESTRELLAS
================================= */

#stars{
    position:absolute;
    inset:0;

    transform-style:preserve-3d;
}

.star{
    position:absolute;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 5px #fff,
        0 0 12px #fff;

    animation:
        twinkle
        2s
        infinite
        alternate;
}

@keyframes twinkle{

    from{
        opacity:.2;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1.5);
    }

}


/* =================================
   TIERRA
================================= */

#earthOrbit{

    position:absolute;

    left:50%;
    top:50%;

    width:330px;
    height:330px;

    transform:
        translate(-50%,-50%)
        translateZ(0);

    transform-style:preserve-3d;

    z-index:30;
}


/* PLANETA */

#earth{

    position:absolute;

    left:50%;
    top:50%;

    width:280px;
    height:280px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    overflow:hidden;

    background:

        /* océanos */

        radial-gradient(
            circle at 35% 30%,
            #65c9ff 0%,
            #0878c9 35%,
            #03467f 65%,
            #011a35 100%
        );

    box-shadow:

        inset
        -35px -20px 50px
        rgba(0,0,0,.95),

        inset
        20px 15px 30px
        rgba(255,255,255,.2),

        0 0 15px
        rgba(120,220,255,.9),

        0 0 40px
        rgba(60,160,255,.9),

        0 0 90px
        rgba(70,100,255,.6);

    animation:
        earthSpin
        22s
        linear
        infinite;

}


/* CONTINENTES */

.land{
    position:absolute;

    background:
        linear-gradient(
            135deg,
            #8bcf50,
            #3c8d35 55%,
            #18551e
        );

    box-shadow:
        inset -4px -4px 8px
        rgba(0,0,0,.25);

    opacity:.95;

}


/* AMÉRICA */

.land1{
    width:70px;
    height:135px;

    left:62px;
    top:65px;

    border-radius:
        60% 40% 55% 45%;

    transform:rotate(20deg);
}

.land2{
    width:35px;
    height:85px;

    left:92px;
    top:160px;

    border-radius:
        50% 40% 60% 50%;

    transform:rotate(-10deg);
}


/* EUROPA / ÁFRICA */

.land3{
    width:70px;
    height:75px;

    left:145px;
    top:55px;

    border-radius:
        45% 55% 50% 60%;

    transform:rotate(-12deg);
}

.land4{
    width:62px;
    height:105px;

    left:155px;
    top:110px;

    border-radius:
        45% 50% 55% 50%;

    transform:rotate(12deg);
}


/* ASIA */

.land5{
    width:90px;
    height:55px;

    left:185px;
    top:50px;

    border-radius:
        60% 40% 45% 55%;

    transform:rotate(10deg);
}


/* AUSTRALIA */

.land6{
    width:45px;
    height:28px;

    left:205px;
    top:175px;

    border-radius:50%;

    transform:rotate(15deg);
}


/* ATMÓSFERA */

.earthAtmosphere{

    position:absolute;

    left:50%;
    top:50%;

    width:296px;
    height:296px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    border:
        2px solid
        rgba(150,225,255,.8);

    box-shadow:

        0 0 20px
        rgba(100,200,255,.9),

        0 0 50px
        rgba(80,150,255,.6);

    pointer-events:none;
}


@keyframes earthSpin{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }

}


/* =================================
   ÓRBITA DE PALABRAS
================================= */

#orbit{

    position:absolute;

    left:50%;
    top:50%;

    width:700px;
    height:700px;

    transform:
        translate(-50%,-50%);

    transform-style:preserve-3d;

    animation:
        orbitSpin
        25s
        linear
        infinite;

    z-index:50;

}


@keyframes orbitSpin{

    from{
        transform:
            translate(-50%,-50%)
            rotateZ(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotateZ(360deg);
    }

}


/* =================================
   PALABRAS
================================= */

.word{

    position:absolute;

    left:50%;
    top:50%;

    color:#fff;

    white-space:nowrap;

    font-size:
        clamp(17px,4.5vw,34px);

    font-weight:bold;

    text-shadow:

        0 0 5px #fff,

        0 0 13px #ffd52e,

        0 0 25px #ff9d00,

        0 0 40px #a54cff;

    transform-style:preserve-3d;

    animation:
        wordFloat
        3s
        infinite
        alternate
        ease-in-out;

}


/* posiciones orbitales */

.w1{
    transform:
        translate(-50%,-50%)
        translateX(330px)
        translateY(-40px)
        rotateZ(0deg);
}

.w2{
    transform:
        translate(-50%,-50%)
        translateX(250px)
        translateY(-180px)
        rotateZ(25deg);
}

.w3{
    transform:
        translate(-50%,-50%)
        translateX(40px)
        translateY(-315px)
        rotateZ(-5deg);
}

.w4{
    transform:
        translate(-50%,-50%)
        translateX(-210px)
        translateY(-230px)
        rotateZ(-20deg);
}

.w5{
    transform:
        translate(-50%,-50%)
        translateX(-330px)
        translateY(-40px)
        rotateZ(-10deg);
}

.w6{
    transform:
        translate(-50%,-50%)
        translateX(-260px)
        translateY(150px)
        rotateZ(15deg);
}

.w7{
    transform:
        translate(-50%,-50%)
        translateX(-80px)
        translateY(300px)
        rotateZ(5deg);
}

.w8{
    transform:
        translate(-50%,-50%)
        translateX(150px)
        translateY(250px)
        rotateZ(-10deg);
}

.w9{
    transform:
        translate(-50%,-50%)
        translateX(300px)
        translateY(140px)
        rotateZ(15deg);
}

.w10{
    transform:
        translate(-50%,-50%)
        translateX(250px)
        translateY(20px)
        rotateZ(-15deg);
}


@keyframes wordFloat{

    from{
        margin-top:-5px;
        opacity:.65;
    }

    to{
        margin-top:5px;
        opacity:1;
    }

}


/* =================================
   FLORES
================================= */

#flowers{

    position:fixed;

    inset:0;

    z-index:100;

    pointer-events:none;

    opacity:0;

    transition:opacity 2s;
}

#flowers.show{
    opacity:1;
}

.flower{

    position:absolute;

    bottom:-120px;

    width:80px;
    height:120px;

    animation:
        flowerUp
        3s
        forwards
        ease-out;

}


/* pétalos */

.petal{

    position:absolute;

    width:30px;
    height:50px;

    left:25px;
    top:0;

    border-radius:60%;

    transform-origin:
        50% 100%;

    background:
        radial-gradient(
            ellipse at 50% 15%,
            #ffffbd,
            #ffe32a 45%,
            #d99500 100%
        );

    box-shadow:
        0 0 8px #ffd000,
        0 0 20px rgba(255,200,0,.5);
}

.petal:nth-child(1){
    transform:rotate(0deg);
}

.petal:nth-child(2){
    transform:rotate(60deg);
}

.petal:nth-child(3){
    transform:rotate(120deg);
}

.petal:nth-child(4){
    transform:rotate(180deg);
}

.petal:nth-child(5){
    transform:rotate(240deg);
}

.petal:nth-child(6){
    transform:rotate(300deg);
}


.center{

    position:absolute;

    left:27px;
    top:26px;

    width:27px;
    height:27px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff49b,
            #d69a00 55%,
            #805000
        );

    box-shadow:
        0 0 10px #ffd000;

}


.stem{

    position:absolute;

    width:5px;
    height:90px;

    left:38px;
    top:48px;

    background:
        linear-gradient(
            #6eb746,
            #244d20
        );

    border-radius:10px;

}


@keyframes flowerUp{

    0%{
        transform:
            translateY(130px)
            scale(0);
        opacity:0;
    }

    60%{
        transform:
            translateY(0)
            scale(1.1);
        opacity:1;
    }

    100%{
        transform:
            translateY(0)
            scale(1);
        opacity:1;
    }

}


/* =================================
   INDICACIÓN
================================= */

#hint{

    position:fixed;

    left:50%;
    bottom:7%;

    transform:
        translateX(-50%);

    color:
        rgba(255,255,255,.8);

    font-size:13px;

    letter-spacing:2px;

    z-index:300;

    opacity:0;

    transition:opacity 2s;

    white-space:nowrap;

}

#hint.show{
    opacity:1;
}


/* =================================
   MENSAJE FINAL
================================= */

#final{

    position:fixed;

    inset:0;

    z-index:500;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:
        opacity 3s,
        transform 3s;

    transform:
        scale(.65);

    background:
        radial-gradient(
            circle,
            rgba(0,0,0,.1),
            rgba(0,0,0,.6)
        );

}

#final.show{

    opacity:1;

    transform:scale(1);

}

.final-small{

    color:white;

    font-size:
        clamp(24px,6vw,38px);

    text-shadow:
        0 0 10px white,
        0 0 25px white;

}

.final-name{

    color:#39ff14;

    font-size:
        clamp(58px,17vw,120px);

    font-weight:bold;

    letter-spacing:4px;

    text-shadow:

        0 0 8px #39ff14,

        0 0 20px #39ff14,

        0 0 40px #39ff14,

        0 0 80px rgba(57,255,20,.7);

    animation:
        greenGlow
        2s
        infinite
        alternate;

}

.final-signature{

    margin-top:12px;

    color:#39ff14;

    font-size:
        clamp(23px,6vw,40px);

    letter-spacing:3px;

    text-shadow:
        0 0 8px #39ff14,
        0 0 20px #39ff14;

}

@keyframes greenGlow{

    from{
        filter:brightness(.9);
    }

    to{
        filter:brightness(1.5);
    }

}


/* =================================
   MÚSICA
================================= */

#musicButton{

    position:fixed;

    right:18px;
    bottom:18px;

    z-index:600;

    width:52px;
    height:52px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.5);

    background:
        rgba(0,0,0,.55);

    color:white;

    font-size:21px;

    display:none;

}

#musicButton.show{
    display:block;
}


/* =================================
   MÓVIL
================================= */

@media(max-width:600px){

    #earthOrbit{

        width:300px;
        height:300px;

    }

    #earth{

        width:235px;
        height:235px;

    }

    .earthAtmosphere{

        width:250px;
        height:250px;

    }

    #orbit{

        width:570px;
        height:570px;

    }

    .w1{
        transform:
            translate(-50%,-50%)
            translateX(260px)
            translateY(-25px);
    }

    .w2{
        transform:
            translate(-50%,-50%)
            translateX(190px)
            translateY(-150px);
    }

    .w3{
        transform:
            translate(-50%,-50%)
            translateX(20px)
            translateY(-250px);
    }

    .w4{
        transform:
            translate(-50%,-50%)
            translateX(-175px)
            translateY(-180px);
    }

    .w5{
        transform:
            translate(-50%,-50%)
            translateX(-260px)
            translateY(-25px);
    }

    .w6{
        transform:
            translate(-50%,-50%)
            translateX(-200px)
            translateY(125px);
    }

    .w7{
        transform:
            translate(-50%,-50%)
            translateX(-60px)
            translateY(235px);
    }

    .w8{
        transform:
            translate(-50%,-50%)
            translateX(115px)
            translateY(200px);
    }

    .w9{
        transform:
            translate(-50%,-50%)
            translateX(235px)
            translateY(110px);
    }

    .w10{
        transform:
            translate(-50%,-50%)
            translateX(200px)
            translateY(15px);
    }

    .word{
        font-size:18px;
    }

    .enter{
        font-size:44px;
    }

}


/* =================================
   OCULTAR TEXTO DE ÓRBITA
   DURANTE FINAL
================================= */

.final-active #orbit{
    opacity:.15;
    transition:opacity 3s;
}

</style>
</head>


<body>


<!-- =================================
     ENTRADA
================================= -->

<div id="start">

    <div class="enter">

        <span>TOCA</span>

        <span>Y</span>

        <span>ENTRA</span>

    </div>

</div>


<!-- =================================
     MÚSICA
================================= -->

<audio
    id="music"
    src="musica.mp3"
    loop
    preload="auto">
</audio>


<!-- =================================
     UNIVERSO
================================= -->

<div id="space">

    <div id="scene">

        <div class="nebula"></div>

        <div id="stars"></div>


        <!-- TIERRA -->

        <div id="earthOrbit">

            <div id="earth">

                <div class="land land1"></div>
                <div class="land land2"></div>
                <div class="land land3"></div>
                <div class="land land4"></div>
                <div class="land land5"></div>
                <div class="land land6"></div>

            </div>

            <div class="earthAtmosphere"></div>

        </div>


        <!-- PALABRAS EN ÓRBITA -->

        <div id="orbit">

            <div class="word w1">
                Beatriz ❤️
            </div>

            <div class="word w2">
                Niña hermosa ✨
            </div>

            <div class="word w3">
                Eres especial 🌻
            </div>

            <div class="word w4">
                Qué bonita eres 💫
            </div>

            <div class="word w5">
                Me encantas ❤️
            </div>

            <div class="word w6">
                Para ti 🌻
            </div>

            <div class="word w7">
                Hermosa 💚
            </div>

            <div class="word w8">
                Tu sonrisa ✨
            </div>

            <div class="word w9">
                Qué linda eres 🌻
            </div>

            <div class="word w10">
                Nunca dejes de sonreír ❤️
            </div>

        </div>

    </div>

</div>


<!-- =================================
     FLORES
================================= -->

<div id="flowers"></div>


<!-- =================================
     INDICACIÓN
================================= -->

<div id="hint">
    👆 MUEVE EL UNIVERSO CON TU DEDO
</div>


<!-- =================================
     FINAL
================================= -->

<div id="final">

    <div class="final-small">
        Para
    </div>

    <div class="final-name">
        BEATRIZ
    </div>

    <div class="final-signature">
        wălt stĕb
    </div>

</div>


<!-- =================================
     MÚSICA
================================= -->

<button id="musicButton">
    🔊
</button>


<script>


/* =================================
   ELEMENTOS
================================= */

const start =
    document.getElementById("start");

const space =
    document.getElementById("space");

const scene =
    document.getElementById("scene");

const stars =
    document.getElementById("stars");

const flowers =
    document.getElementById("flowers");

const hint =
    document.getElementById("hint");

const final =
    document.getElementById("final");

const music =
    document.getElementById("music");

const musicButton =
    document.getElementById("musicButton");


/* =================================
   CREAR ESTRELLAS
================================= */

for(let i=0;i<350;i++){

    const star =
        document.createElement("div");

    star.className="star";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    const size =
        Math.random()*2.5+.4;

    star.style.width =
        size+"px";

    star.style.height =
        size+"px";

    star.style.transform =
        `translateZ(${
            -900+
            Math.random()*1300
        }px)`;

    star.style.animationDuration =
        1+
        Math.random()*4+
        "s";

    star.style.animationDelay =
        Math.random()*4+
        "s";

    stars.appendChild(star);

}


/* =================================
   FLORES
================================= */

const flowerPositions=[
    2,8,15,22,30,
    38,46,54,62,70,
    78,85,92,97,
    12,28,45,65,82
];


function createFlower(i){

    const flower =
        document.createElement("div");

    flower.className="flower";

    flower.style.left =
        flowerPositions[i]+"%";

    flower.style.animationDelay =
        i*.12+"s";


    for(let j=0;j<6;j++){

        const petal =
            document.createElement("div");

        petal.className="petal";

        flower.appendChild(petal);

    }


    const center =
        document.createElement("div");

    center.className="center";

    flower.appendChild(center);


    const stem =
        document.createElement("div");

    stem.className="stem";

    flower.appendChild(stem);


    flowers.appendChild(flower);

}


for(let i=0;i<flowerPositions.length;i++){

    createFlower(i);

}


/* =================================
   ESTADO
================================= */

let started=false;

let musicPlaying=false;


/* =================================
   MOVIMIENTO
================================= */

let rotX=0;

let rotY=0;

let lastX=0;

let lastY=0;

let dragging=false;

let scale=1;

let pinchStart=0;


/* =================================
   APLICAR MOVIMIENTO
================================= */

function updateScene(){

    scene.style.transform=

        `translate(-50%,-50%)
         rotateX(${rotX}deg)
         rotateY(${rotY}deg)
         scale(${scale})`;

}


/* =================================
   INICIAR
================================= */

function startExperience(){

    if(started) return;

    started=true;


    /* música */

    music.volume=.55;

    music.play()
        .then(()=>{

            musicPlaying=true;

            musicButton.textContent="🔊";

        })
        .catch(()=>{

            musicPlaying=false;

        });


    start.classList.add("hidden");


    setTimeout(()=>{

        space.classList.add("show");

        hint.classList.add("show");

    },400);


    setTimeout(()=>{

        hint.classList.remove("show");

    },6000);


    /* flores */

    setTimeout(()=>{

        flowers.classList.add("show");

    },9000);


    /* final */

    setTimeout(()=>{

        document.body.classList.add(
            "final-active"
        );

        final.classList.add("show");

        musicButton.classList.add("show");

    },15000);

}


/* =================================
   TOQUE INICIAL
================================= */

start.addEventListener(
    "pointerdown",
    ()=>{

        if(!started){

            music.volume=.55;

            music.play()
                .catch(()=>{});

        }

    }
);


start.addEventListener(
    "click",
    startExperience
);


/* =================================
   ARRASTRAR CON UN DEDO
================================= */

scene.addEventListener(
    "pointerdown",
    event=>{

        if(!started) return;

        dragging=true;

        lastX=
            event.clientX;

        lastY=
            event.clientY;

    }
);


window.addEventListener(
    "pointermove",
    event=>{

        if(
            !dragging ||
            !started
        ){
            return;
        }


        const dx =
            event.clientX-lastX;

        const dy =
            event.clientY-lastY;


        rotY +=
            dx*.4;

        rotX -=
            dy*.4;


        rotX =
            Math.max(
                -65,
                Math.min(
                    65,
                    rotX
                )
            );


        updateScene();


        lastX=
            event.clientX;

        lastY=
            event.clientY;

    }
);


window.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);


/* =================================
   ZOOM CON DOS DEDOS
================================= */

scene.addEventListener(
    "touchstart",
    event=>{

        if(
            event.touches.length===2
        ){

            pinchStart=
                Math.hypot(

                    event.touches[0].clientX-
                    event.touches[1].clientX,

                    event.touches[0].clientY-
                    event.touches[1].clientY

                );

        }

    },
    {passive:true}
);


scene.addEventListener(
    "touchmove",
    event=>{

        if(
            event.touches.length===2 &&
            pinchStart
        ){

            const distance=
                Math.hypot(

                    event.touches[0].clientX-
                    event.touches[1].clientX,

                    event.touches[0].clientY-
                    event.touches[1].clientY

                );


            scale *=
                distance/pinchStart;


            scale=
                Math.max(
                    .65,
                    Math.min(
                        1.8,
                        scale
                    )
                );


            pinchStart=
                distance;


            updateScene();

        }

    },
    {passive:true}
);


scene.addEventListener(
    "touchend",
    ()=>{
        pinchStart=0;
    },
    {passive:true}
);


/* =================================
   MÚSICA
================================= */

musicButton.addEventListener(
    "click",
    ()=>{

        if(musicPlaying){

            music.pause();

            musicPlaying=false;

            musicButton.textContent="🔇";

        }else{

            music.play()
                .then(()=>{

                    musicPlaying=true;

                    musicButton.textContent="🔊";

                })
                .catch(()=>{});

        }

    }
);

</script>
