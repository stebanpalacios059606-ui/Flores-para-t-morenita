<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#03030a">

<title>Orbit — Para ti</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03030a;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    touch-action: none;
}

body {
    position: fixed;
}

/* FONDO */

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(120, 80, 190, .22),
            transparent 32%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(30, 80, 170, .16),
            transparent 45%
        ),
        #03030a;
}

/* ESTRELLAS */

#stars {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* ENCABEZADO */

#top {
    position: absolute;
    top: max(22px, env(safe-area-inset-top));
    left: 0;
    right: 0;

    text-align: center;
    z-index: 10;

    pointer-events: none;
}

.kicker {
    font-size: 10px;
    letter-spacing: 5px;
    opacity: .55;
    text-transform: uppercase;
}

h1 {
    margin-top: 8px;
    font-size: clamp(30px, 9vw, 50px);
    font-weight: 700;
    letter-spacing: -2px;

    text-shadow:
        0 0 15px rgba(255,255,255,.25),
        0 5px 25px rgba(0,0,0,.8);
}

/* ESCENA */

#scene {
    position: absolute;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    perspective: 900px;
}

/* ORBE */

#orb {
    position: relative;

    width: min(70vw, 340px);
    height: min(70vw, 340px);

    border-radius: 50%;

    transform-style: preserve-3d;

    will-change: transform;

    box-shadow:
        0 0 30px rgba(180,130,255,.28),
        0 0 90px rgba(80,120,255,.12);
}

/* FOTO */

#photoContainer {
    position: absolute;
    inset: 0;

    border-radius: 50%;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,.45);

    background:
        radial-gradient(
            circle,
            #33234e,
            #10101d
        );

    transform: translateZ(18px);

    box-shadow:
        inset -30px -20px 60px rgba(0,0,0,.55),
        inset 15px 10px 35px rgba(255,255,255,.12),
        0 0 35px rgba(190,150,255,.15);
}

#photo {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    filter:
        saturate(1.08)
        contrast(1.05);
}

/* REFLEJO */

#shine {
    position: absolute;
    inset: 0;

    border-radius: 50%;

    pointer-events: none;

    background:
        linear-gradient(
            125deg,
            rgba(255,255,255,.25),
            transparent 25%,
            transparent 65%,
            rgba(0,0,0,.32)
        );
}

/* ANILLOS */

.ring {
    position: absolute;

    inset: -5%;

    border-radius: 50%;

    border: 1px solid rgba(220,200,255,.28);

    transform-style: preserve-3d;

    pointer-events: none;
}

#ring1 {
    transform:
        rotateX(70deg)
        rotateZ(-20deg);

    animation:
        orbitOne 9s linear infinite;
}

#ring2 {
    inset: -10%;

    border-color:
        rgba(130,190,255,.18);

    transform:
        rotateY(70deg)
        rotateZ(20deg);

    animation:
        orbitTwo 13s linear infinite;
}

#ring3 {
    inset: -16%;

    border-color:
        rgba(255,255,255,.09);

    transform:
        rotateX(65deg)
        rotateY(25deg);

    animation:
        orbitThree 18s linear infinite;
}

@keyframes orbitOne {

    from {
        transform:
            rotateX(70deg)
            rotateZ(-20deg);
    }

    to {
        transform:
            rotateX(70deg)
            rotateZ(340deg);
    }
}

@keyframes orbitTwo {

    from {
        transform:
            rotateY(70deg)
            rotateZ(20deg);
    }

    to {
        transform:
            rotateY(70deg)
            rotateZ(-340deg);
    }
}

@keyframes orbitThree {

    from {
        transform:
            rotateX(65deg)
            rotateY(25deg)
            rotateZ(0deg);
    }

    to {
        transform:
            rotateX(65deg)
            rotateY(25deg)
            rotateZ(360deg);
    }
}

/* LUCES */

.light {
    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px 3px white;
}

#light1 {
    top: 3%;
    left: 60%;
}

#light2 {
    bottom: 8%;
    left: 4%;
}

#light3 {
    top: 44%;
    right: -7%;
}

/* TEXTO INFERIOR */

#bottom {
    position: absolute;

    left: 18px;
    right: 18px;

    bottom:
        max(22px, env(safe-area-inset-bottom));

    text-align: center;

    z-index: 10;
}

#message {
    max-width: 550px;

    margin:
        0 auto 16px;

    font-size: 15px;

    line-height: 1.5;

    color:
        rgba(255,255,255,.86);

    text-shadow:
        0 2px 12px black;
}

/* BOTÓN */

button {
    border: 1px solid
        rgba(255,255,255,.25);

    background:
        rgba(255,255,255,.08);

    color: white;

    border-radius: 999px;

    padding:
        12px 20px;

    font-size: 14px;

    font-weight: 600;

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    transition:
        transform .15s,
        background .15s;
}

button:active {
    transform: scale(.94);

    background:
        rgba(255,255,255,.18);
}

#hint {
    margin-top: 10px;

    font-size: 10px;

    opacity: .4;
}

/* CARGANDO */

#loader {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #03030a;

    z-index: 100;

    transition:
        opacity .6s;
}

.loaderContent {
    text-align: center;
}

.loaderContent strong {
    display: block;

    margin-bottom: 12px;

    font-size: 14px;
}

.loaderBar {
    width: 150px;
    height: 3px;

    overflow: hidden;

    border-radius: 10px;

    background: #222231;
}

.loaderBar span {
    display: block;

    width: 50%;
    height: 100%;

    background: white;

    animation:
        loading 1s infinite;
}

@keyframes loading {

    0% {
        transform: translateX(-150%);
    }

    100% {
        transform: translateX(300%);
    }
}

/* PANTALLAS PEQUEÑAS */

@media (max-height: 650px) {

    #orb {
        width: min(58vw, 280px);
        height: min(58vw, 280px);
    }

    h1 {
        font-size: 30px;
    }

    #message {
        font-size: 13px;
    }
}

/* MENOS ANIMACIÓN */

@media (prefers-reduced-motion: reduce) {

    #ring1,
    #ring2,
    #ring3 {
        animation: none;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- ESTRELLAS -->
    <canvas id="stars"></canvas>


    <!-- TITULO -->

    <div id="top">

        <div class="kicker">
            ORBIT · MOBILE EDITION
        </div>

        <h1>
            Para ti
        </h1>

    </div>


    <!-- ESCENA -->

    <div id="scene">

        <div id="orb">

            <!-- ANILLOS -->

            <div
                class="ring"
                id="ring1">
            </div>

            <div
                class="ring"
                id="ring2">
            </div>

            <div
                class="ring"
                id="ring3">
            </div>


            <!-- FOTO -->

            <div id="photoContainer">

                <!--
                CAMBIA ESTA IMAGEN
                POR LA FOTO REAL.

                La imagen debe llamarse:

                muchacha.jpg

                -->

                <img
                    id="photo"
                    src="muchacha.jpg"
                    alt="Foto">

                <div id="shine"></div>

            </div>


            <!-- LUCES -->

            <span
                class="light"
                id="light1">
            </span>

            <span
                class="light"
                id="light2">
            </span>

            <span
                class="light"
                id="light3">
            </span>

        </div>

    </div>


    <!-- MENSAJE -->

    <div id="bottom">

        <p id="message">

            Una pequeña parte del universo,
            hecha especialmente para ti. ✨

        </p>

        <button id="action">

            Tocar para cambiar

        </button>

        <div id="hint">

            Arrastra la imagen · toca para interactuar

        </div>

    </div>


    <!-- CARGANDO -->

    <div id="loader">

        <div class="loaderContent">

            <strong>
                Preparando Orbit…
            </strong>

            <div class="loaderBar">
                <span></span>
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   ESTRELLAS
===================================================== */

const canvas =
    document.getElementById("stars");

const ctx =
    canvas.getContext("2d");

let W;
let H;
let DPR;

let stars = [];

function resizeCanvas() {

    W = window.innerWidth;
    H = window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    /*
       Limitamos las estrellas
       para que Android no tenga
       que trabajar demasiado.
    */

    const amount =
        Math.min(
            90,
            Math.max(
                45,
                Math.floor(
                    W * H / 8500
                )
            )
        );

    stars = [];

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        stars.push({

            x:
                Math.random() * W,

            y:
                Math.random() * H,

            radius:
                Math.random() * 1.4
                + .2,

            speed:
                Math.random() * .22
                + .04,

            opacity:
                Math.random() * .6
                + .15

        });

    }
}


/* =====================================================
   ANIMACIÓN DE ESTRELLAS
===================================================== */

function drawStars(time) {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    for (
        const star of stars
    ) {

        star.y += star.speed;

        if (
            star.y > H
        ) {
            star.y = -2;
        }

        ctx.globalAlpha =
            star.opacity *
            (
                .7 +
                .3 *
                Math.sin(
                    time * .001
                    + star.x
                )
            );

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.fill();

    }

    ctx.globalAlpha = 1;

    requestAnimationFrame(
        drawStars
    );
}


/* =====================================================
   CONTROL DEL ORBE
===================================================== */

const orb =
    document.getElementById("orb");

let rotateX = 0;
let rotateY = 0;

let targetX = 0;
let targetY = 0;

let dragging = false;

let previousX = 0;
let previousY = 0;


function updateOrb() {

    orb.style.transform =
        "rotateX(" +
        rotateX +
        "deg) rotateY(" +
        rotateY +
        "deg)";

}


/* =====================================================
   INTERACCIÓN TÁCTIL
===================================================== */

window.addEventListener(
    "pointerdown",
    function(event) {

        dragging = true;

        previousX =
            event.clientX;

        previousY =
            event.clientY;

    }
);


window.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {

            targetX =
                (
                    event.clientX -
                    window.innerWidth / 2
                ) / 40;

            targetY =
                -(
                    event.clientY -
                    window.innerHeight / 2
                ) / 50;

            return;

        }


        const dx =
            event.clientX -
            previousX;

        const dy =
            event.clientY -
            previousY;


        rotateY +=
            dx * .35;

        rotateX -=
            dy * .35;


        previousX =
            event.clientX;

        previousY =
            event.clientY;


        updateOrb();

    }
);


window.addEventListener(
    "pointerup",
    function() {

        dragging = false;

    }
);


/* =====================================================
   MOVIMIENTO SUAVE
===================================================== */

function smoothMovement() {

    if (!dragging) {

        rotateY +=
            (
                targetX -
                rotateY
            ) * .018;

        rotateX +=
            (
                targetY -
                rotateX
            ) * .018;

        updateOrb();

    }

    requestAnimationFrame(
        smoothMovement
    );
}


/* =====================================================
   MENSAJES
===================================================== */

const messages = [

    "Una pequeña parte del universo, hecha especialmente para ti. ✨",

    "Que esta luz te recuerde lo especial que eres. 💫",

    "Entre millones de estrellas, hoy esta órbita tiene tu nombre. 🌙",

    "Solo quería regalarte un pequeño momento bonito. ❤️"

];

let messageIndex = 0;


document
    .getElementById("action")
    .addEventListener(
        "click",
        function() {

            messageIndex++;

            if (
                messageIndex >=
                messages.length
            ) {

                messageIndex = 0;

            }

            document
                .getElementById("message")
                .textContent =
                messages[
                    messageIndex
                ];

        }
    );


/* =====================================================
   INICIAR
===================================================== */

resizeCanvas();

requestAnimationFrame(
    drawStars
);

requestAnimationFrame(
    smoothMovement
);


/* =====================================================
   PANTALLA DE CARGA
===================================================== */

setTimeout(
    function() {

        const loader =
            document.getElementById(
                "loader"
            );

        loader.style.opacity = "0";

        setTimeout(
            function() {

                loader.remove();

            },
            600
        );

    },
    800
);

</script>

</body>
</html>
