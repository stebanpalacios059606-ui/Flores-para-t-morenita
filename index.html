<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Beatriz 🌻</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Georgia,"Times New Roman",serif;
}

/* =========================
   PANTALLA INICIAL
========================= */

#start{
    position:fixed;
    inset:0;
    z-index:100;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    cursor:pointer;
    transition:opacity 2s ease;
}

#start.hidden{
    opacity:0;
    pointer-events:none;
}

.enter{
    color:#fff4c4;
    font-size:clamp(40px,12vw,80px);
    font-weight:bold;
    line-height:1.2;
    letter-spacing:8px;

    text-shadow:
        0 0 8px rgba(255,244,196,.9),
        0 0 20px rgba(255,210,80,.5);

    animation:pulse 2.5s infinite ease-in-out;
}

.enter span{
    display:block;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
        opacity:.75;
    }

    50%{
        transform:scale(1.07);
        opacity:1;
    }
}

/* =========================
   ESPACIO
========================= */

#space{
    position:fixed;
    inset:0;
    opacity:0;

    background:
        radial-gradient(
            ellipse at center,
            #35125d 0%,
            #18082d 30%,
            #070313 60%,
            #000 100%
        );

    transition:opacity 4s ease;
}

#space.show{
    opacity:1;
}

/* =========================
   NEBULOSA
========================= */

.nebula{
    position:absolute;

    width:110vw;
    height:80vw;

    max-width:1100px;
    max-height:800px;

    left:50%;
    top:48%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,150,50,.22) 0%,
            rgba(190,70,255,.20) 22%,
            rgba(60,90,255,.16) 42%,
            rgba(255,60,160,.10) 55%,
            transparent 75%
        );

    filter:blur(35px);

    animation:nebulaMove 14s infinite alternate ease-in-out;
}

@keyframes nebulaMove{

    0%{
        transform:
            translate(-53%,-48%)
            scale(.90)
            rotate(-5deg);
    }

    100%{
        transform:
            translate(-47%,-52%)
            scale(1.15)
            rotate(5deg);
    }
}

/* =========================
   ESTRELLAS
========================= */

#stars{
    position:absolute;
    inset:0;

    opacity:0;

    transition:opacity 3s ease;
}

#stars.show{
    opacity:1;
}

.star{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;
    background:white;

    box-shadow:
        0 0 5px white,
        0 0 10px rgba(255,255,255,.7);

    animation:twinkle infinite alternate ease-in-out;
}

@keyframes twinkle{

    0%{
        opacity:.15;
        transform:scale(.5);
    }

    100%{
        opacity:1;
        transform:scale(1.7);
    }
}

/* =========================
   ESTRELLAS GRANDES
========================= */

.big-star{
    position:absolute;

    width:4px;
    height:4px;

    background:white;
    border-radius:50%;

    box-shadow:
        0 0 10px white,
        0 0 20px white;

    animation:bigTwinkle 2s infinite alternate;
}

@keyframes bigTwinkle{

    from{
        opacity:.2;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.8);
    }
}

/* =========================
   FLORES
========================= */

#flowers{
    position:fixed;
    inset:0;

    pointer-events:none;

    opacity:0;

    transition:opacity 2s ease;
}

#flowers.show{
    opacity:1;
}

.flower{
    position:absolute;

    bottom:-120px;

    width:100px;
    height:120px;

    animation:
        grow 3s forwards ease-out;
}

.flower::after{
    content:"";

    position:absolute;

    width:6px;
    height:110px;

    left:47px;
    top:55px;

    border-radius:10px;

    background:
        linear-gradient(
            to bottom,
            #6da944,
            #294d20
        );

    box-shadow:
        0 0 5px rgba(80,180,50,.3);
}

/* pétalos */

.petal{
    position:absolute;

    width:38px;
    height:58px;

    left:31px;
    top:0;

    border-radius:50%;

    transform-origin:50% 100%;

    background:
        radial-gradient(
            ellipse at 50% 20%,
            #fffda0 0%,
            #ffe52e 45%,
            #e8a800 100%
        );

    box-shadow:
        0 0 10px rgba(255,220,30,.8),
        0 0 22px rgba(255,190,0,.3);
}

.petal:nth-child(1){
    transform:rotate(0deg) translateY(-5px);
}

.petal:nth-child(2){
    transform:rotate(60deg) translateY(-5px);
}

.petal:nth-child(3){
    transform:rotate(120deg) translateY(-5px);
}

.petal:nth-child(4){
    transform:rotate(180deg) translateY(-5px);
}

.petal:nth-child(5){
    transform:rotate(240deg) translateY(-5px);
}

.petal:nth-child(6){
    transform:rotate(300deg) translateY(-5px);
}

/* centro */

.center{
    position:absolute;

    width:30px;
    height:30px;

    left:35px;
    top:30px;

    border-radius:50%;

    z-index:5;

    background:
        radial-gradient(
            circle,
            #fff7a0 0%,
            #d99b00 55%,
            #8c5900 100%
        );

    box-shadow:
        0 0 10px #ffd000,
        0 0 20px rgba(255,200,0,.7);
}

@keyframes grow{

    0%{
        transform:
            translateY(120px)
            scale(0)
            rotate(-10deg);

        opacity:0;
    }

    60%{
        transform:
            translateY(0)
            scale(1.15)
            rotate(5deg);

        opacity:1;
    }

    100%{
        transform:
            translateY(0)
            scale(1)
            rotate(0deg);

        opacity:1;
    }
}

/* =========================
   MENSAJE FINAL
========================= */

.final-message{

    position:fixed;
    inset:0;

    z-index:50;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    opacity:0;

    transform:
        scale(.65)
        translateY(30px);

    transition:
        opacity 3s ease,
        transform 3s ease;

    pointer-events:none;
}

.final-message.show{

    opacity:1;

    transform:
        scale(1)
        translateY(0);
}

.small{

    color:#fff;

    font-size:
        clamp(24px,6vw,38px);

    margin-bottom:5px;

    text-shadow:
        0 0 8px white,
        0 0 18px rgba(255,255,255,.5);
}

/* BEATRIZ */

.name{

    color:#39ff14;

    font-size:
        clamp(60px,17vw,125px);

    font-weight:bold;

    letter-spacing:3px;

    text-shadow:
        0 0 5px #39ff14,
        0 0 15px #39ff14,
        0 0 30px #39ff14,
        0 0 60px rgba(57,255,20,.7),
        0 0 100px rgba(57,255,20,.35);

    animation:
        greenGlow 2.5s infinite alternate;
}

@keyframes greenGlow{

    from{
        text-shadow:
            0 0 5px #39ff14,
            0 0 15px #39ff14,
            0 0 30px #39ff14;
    }

    to{
        text-shadow:
            0 0 8px #39ff14,
            0 0 25px #39ff14,
            0 0 50px #39ff14,
            0 0 90px rgba(57,255,20,.6);
    }
}

/* FIRMA */

.signature{

    margin-top:15px;

    color:#39ff14;

    font-size:
        clamp(24px,6vw,40px);

    letter-spacing:3px;

    text-shadow:
        0 0 5px #39ff14,
        0 0 15px #39ff14,
        0 0 30px rgba(57,255,20,.7);
}

/* =========================
   BOTÓN MÚSICA
========================= */

.music-control{

    position:fixed;

    right:18px;
    bottom:18px;

    z-index:80;

    width:50px;
    height:50px;

    border-radius:50%;

    border:
        1px solid rgba(255,255,255,.5);

    background:
        rgba(0,0,0,.45);

    color:white;

    font-size:22px;

    display:none;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    backdrop-filter:blur(8px);

    box-shadow:
        0 0 12px rgba(255,255,255,.2);
}

.music-control.show{
    display:flex;
}

/* =========================
   MÓVIL
========================= */

@media(max-width:600px){

    .enter{
        font-size:43px;
        letter-spacing:6px;
    }

    .flower{
        transform:scale(.85);
    }

    .name{
        font-size:67px;
    }

    .signature{
        font-size:25px;
    }
}
</style>
</head>

<body>

<!-- =========================
     INICIO
========================= -->

<div id="start">

    <div class="enter">
        <span>TOCA</span>
        <span>Y</span>
        <span>ENTRA</span>
    </div>

</div>


<!-- =========================
     MÚSICA
========================= -->

<audio
    id="music"
    src="musica.mp3"
    loop
    preload="auto">
</audio>


<!-- =========================
     GALAXIA
========================= -->

<div id="space">

    <div class="nebula"></div>

    <div id="stars"></div>

</div>


<!-- =========================
     FLORES
========================= -->

<div id="flowers"></div>


<!-- =========================
     MENSAJE
========================= -->

<div
    id="finalMessage"
    class="final-message">

    <div class="small">
        Para
    </div>

    <div class="name">
        Beatriz
    </div>

    <div class="signature">
        wălt stĕb
    </div>

</div>


<!-- =========================
     CONTROL MÚSICA
========================= -->

<button
    id="musicButton"
    class="music-control">
    🔊
</button>


<script>

/* =========================
   CREAR ESTRELLAS
========================= */

const stars =
    document.getElementById("stars");

for(let i = 0; i < 220; i++){

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    const size =
        Math.random() * 2.5 + .5;

    star.style.width =
        size + "px";

    star.style.height =
        size + "px";

    star.style.animationDuration =
        (1 + Math.random() * 4) + "s";

    star.style.animationDelay =
        Math.random() * 4 + "s";

    stars.appendChild(star);
}


/* estrellas grandes */

for(let i = 0; i < 18; i++){

    const star =
        document.createElement("div");

    star.className =
        "big-star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    stars.appendChild(star);
}


/* =========================
   CREAR FLORES
========================= */

const flowers =
    document.getElementById("flowers");

const positions = [
    2, 11, 20, 30, 40,
    50, 60, 70, 80, 90,
    25, 75
];

function createFlower(index){

    const flower =
        document.createElement("div");

    flower.className =
        "flower";

    flower.style.left =
        positions[index] + "%";

    flower.style.animationDelay =
        (index * .25) + "s";

    for(let i = 0; i < 6; i++){

        const petal =
            document.createElement("div");

        petal.className =
            "petal";

        flower.appendChild(petal);
    }

    const center =
        document.createElement("div");

    center.className =
        "center";

    flower.appendChild(center);

    flowers.appendChild(flower);
}

for(let i = 0; i < 12; i++){
    createFlower(i);
}


/* =========================
   ELEMENTOS
========================= */

const start =
    document.getElementById("start");

const space =
    document.getElementById("space");

const finalMessage =
    document.getElementById("finalMessage");

const music =
    document.getElementById("music");

const musicButton =
    document.getElementById("musicButton");


let started = false;
let musicPlaying = false;


/* =========================
   INICIAR
========================= */

function startExperience(){

    if(started) return;

    started = true;


    /* música */

    music.volume = .55;

    music.play()
        .then(() => {

            musicPlaying = true;

            musicButton.innerText =
                "🔊";

        })
        .catch(() => {

            musicPlaying = false;

        });


    /* quitar pantalla negra */

    start.classList.add("hidden");


    /* galaxia */

    setTimeout(() => {

        space.classList.add("show");

        stars.classList.add("show");

    },500);


    /* flores */

    setTimeout(() => {

        flowers.classList.add("show");

    },1800);


    /* mensaje */

    setTimeout(() => {

        finalMessage.classList.add("show");

        musicButton.classList.add("show");

    },5200);
}


/* =========================
   TOCAR
========================= */

start.addEventListener(
    "pointerdown",
    startExperience
);


/* =========================
   MÚSICA
========================= */

musicButton.addEventListener(
    "click",
    () => {

        if(musicPlaying){

            music.pause();

            musicPlaying = false;

            musicButton.innerText =
                "🔇";

        }else{

            music.play()
                .then(() => {

                    musicPlaying = true;

                    musicButton.innerText =
                        "🔊";

                });
        }

    }
);

</script>

</body>
</html>
