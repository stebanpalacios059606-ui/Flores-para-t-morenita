<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para Beatriz 🌻</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:
    radial-gradient(circle at center,#352500 0%,#100d02 42%,#000 100%);
  color:white;
  font-family:Arial,sans-serif;
}

.pantalla{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.flores{
  position:relative;
  width:330px;
  height:380px;
  max-width:90vw;
}

.flor{
  position:absolute;
  bottom:30px;
  left:50%;
  transform-origin:bottom;
}

.flor:nth-child(1){
  margin-left:-105px;
  transform:rotate(-8deg) scale(.8);
}

.flor:nth-child(2){
  margin-left:-50px;
  transform:scale(1);
}

.flor:nth-child(3){
  margin-left:50px;
  transform:rotate(8deg) scale(.8);
}

.tallo{
  width:5px;
  height:210px;
  margin:auto;
  background:linear-gradient(#57913d,#163d18);
  border-radius:10px;
}

.cabeza{
  width:110px;
  height:110px;
  position:relative;
  margin:-12px auto 0;
}

.petalo{
  position:absolute;
  width:48px;
  height:72px;
  left:31px;
  top:19px;
  border-radius:60% 60% 50% 50%;
  background:linear-gradient(135deg,#ffe95b,#efa600);
  transform-origin:50% 80%;
  box-shadow:0 0 12px rgba(255,204,40,.35);
}

.p1{transform:rotate(0deg) translateY(-30px)}
.p2{transform:rotate(45deg) translateY(-30px)}
.p3{transform:rotate(90deg) translateY(-30px)}
.p4{transform:rotate(135deg) translateY(-30px)}
.p5{transform:rotate(180deg) translateY(-30px)}
.p6{transform:rotate(225deg) translateY(-30px)}
.p7{transform:rotate(270deg) translateY(-30px)}
.p8{transform:rotate(315deg) translateY(-30px)}

.centro{
  position:absolute;
  width:40px;
  height:40px;
  left:35px;
  top:35px;
  border-radius:50%;
  background:#713900;
  border:5px solid #914d00;
}

.mensaje{
  max-width:520px;
  position:relative;
  z-index:5;
}

h1{
  font-size:clamp(28px,8vw,46px);
  margin:0 0 15px;
  color:#ffd84d;
  text-shadow:0 0 15px rgba(255,204,40,.4);
}

p{
  font-size:clamp(16px,4.8vw,21px);
  line-height:1.55;
  margin:0;
}

.firma{
  margin-top:18px;
  color:#ffd84d;
  letter-spacing:2px;
  font-size:15px;
}

.corazon{
  animation:latido 1.3s infinite;
  display:inline-block;
}

@keyframes latido{
  50%{transform:scale(1.25)}
}

@media(max-height:650px){
  .flores{
    height:280px;
  }

  .tallo{
    height:150px;
  }

  p{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div class="pantalla">

  <div class="flores">

    <div class="flor">
      <div class="tallo"></div>
      <div class="cabeza">
        <i class="petalo p1"></i>
        <i class="petalo p2"></i>
        <i class="petalo p3"></i>
        <i class="petalo p4"></i>
        <i class="petalo p5"></i>
        <i class="petalo p6"></i>
        <i class="petalo p7"></i>
        <i class="petalo p8"></i>
        <i class="centro"></i>
      </div>
    </div>

    <div class="flor">
      <div class="tallo"></div>
      <div class="cabeza">
        <i class="petalo p1"></i>
        <i class="petalo p2"></i>
        <i class="petalo p3"></i>
        <i class="petalo p4"></i>
        <i class="petalo p5"></i>
        <i class="petalo p6"></i>
        <i class="petalo p7"></i>
        <i class="petalo p8"></i>
        <i class="centro"></i>
      </div>
    </div>

    <div class="flor">
      <div class="tallo"></div>
      <div class="cabeza">
        <i class="petalo p1"></i>
        <i class="petalo p2"></i>
        <i class="petalo p3"></i>
        <i class="petalo p4"></i>
        <i class="petalo p5"></i>
        <i class="petalo p6"></i>
        <i class="petalo p7"></i>
        <i class="petalo p8"></i>
        <i class="centro"></i>
      </div>
    </div>

  </div>

  <div class="mensaje">

    <h1>Para ti, Beatriz 🌻</h1>

    <p>
      Hola niña hermosa, este día no te mando algo
      que puedas tocar, pero sí algo que puedes ver
      y guardar. No te conozco mucho, pero te lo mando
      con todo mi <span class="corazon">❤️</span>
    </p>

    <div class="firma">
      wălt stĕb
    </div>

  </div>

</div>

</body>
</html>
