<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para Beatriz 🌻🌎</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Georgia,"Times New Roman",serif;
    touch-action:none;
}

/* =========================
   PANTALLA INICIAL
========================= */

#start{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    transition:opacity 2s ease;
}

#start.hidden{
    opacity:0;
    pointer-events:none;
}

.enter{
    color:#fff6c9;
    font-size:clamp(42px,12vw,82px);
    font-weight:bold;
    letter-spacing:8px;
    line-height:1.15;
    text-shadow:
        0 0 10px #fff,
        0 0 25px #ffd83d,
        0 0 50px rgba(255,180,0,.6);
    animation:pulse 2.5s infinite ease-in-out;
}

.enter span{
    display:block;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
        opacity:.75;
    }
    50%{
        transform:scale(1.08);
        opacity:1;
    }
}

/* =========================
   ESPACIO
========================= */

#space{
    position:fixed;
    inset:0;
    opacity:0;
    overflow:hidden;
    background:
        radial-gradient(
            ellipse at center,
            #291050 0%,
            #110621 35%,
            #03020a 70%,
            #000 100%
        );
    transition:opacity 4s ease;
}

#space.show{
    opacity:1;
}

/* =========================
   ESCENA 3D
========================= */

#scene{
    position:absolute;
    width:100%;
    height:100%;
    left:0;
    top:0;

    perspective:1000px;
    perspective-origin:50% 50%;

    transform-style:preserve-3d;

    will-change:transform;
}

/* =========================
   NEBULOSA
========================= */

.nebula{
    position:absolute;
    width:130vw;
    height:90vw;
    max-width:1300px;
    max-height:900px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        translateZ(-500px);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,180,50,.25) 0%,
            rgba(180,70,255,.23) 22%,
            rgba(70,80,255,.18) 42%,
            rgba(255,50,160,.10) 58%,
            transparent 76%
        );

    filter:blur(35px);

    animation:nebulaMove 18s infinite alternate ease-in-out;
}

@keyframes nebulaMove{
    from{
        transform:
            translate(-53%,-48%)
            translateZ(-500px)
            scale(.9)
            rotate(-5deg);
    }

    to{
        transform:
            translate(-47%,-52%)
            translateZ(-500px)
            scale(1.18)
            rotate(5deg);
    }
}

/* =========================
   ESTRELLAS
========================= */

#stars{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
}

.star{
    position:absolute;
    border-radius:50%;
    background:white;

    box-shadow:
        0 0 5px white,
        0 0 12px rgba(255,255,255,.8);

    animation:twinkle infinite alternate ease-in-out;
}

@keyframes twinkle{
    from{
        opacity:.15;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1.6);
    }
}

.star-big{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:white;

    box-shadow:
        0 0 10px white,
        0 0 25px white;

    animation:bigStar 2s infinite alternate;
}

@keyframes bigStar{
    from{
        opacity:.2;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(2);
    }
}

/* =========================
   TIERRA
========================= */

#earth{
    position:absolute;

    left:50%;
    top:50%;

    width:min(48vw,380px);
    height:min(48vw,380px);

    min-width:230px;
    min-height:230px;

    transform:
        translate(-50%,-50%)
        translateZ(0);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,.85) 0%,
            rgba(100,180,255,.35) 8%,
            transparent 17%
        ),
        radial-gradient(
            circle at 62% 55%,
            #1c78c8 0%,
            #07528d 42%,
            #031d3d 72%,
            #000 100%
        );

    box-shadow:
        inset -35px -25px 60px rgba(0,0,0,.9),
        inset 20px 15px 35px rgba(255,255,255,.18),
        0 0 20px rgba(90,180,255,.8),
        0 0 55px rgba(50,130,255,.55),
        0 0 110px rgba(70,80,255,.35);

    overflow:hidden;

    animation:earthRotate 24s linear infinite;

    z-index:20;
}

/* continentes */

.continent{
    position:absolute;
    background:
        linear-gradient(
            135deg,
            #79b83c,
            #2c702c 60%,
            #16481e
        );

    opacity:.9;

    filter:blur(.5px);

    border-radius:
        55% 45% 60% 40% /
        50% 60% 40% 50%;
}

.c1{
    width:28%;
    height:38%;
    left:18%;
    top:19%;
    transform:rotate(18deg);
}

.c2{
    width:22%;
    height:45%;
    left:42%;
    top:27%;
    transform:rotate(-20deg);
}

.c3{
    width:28%;
    height:25%;
    left:63%;
    top:15%;
    transform:rotate(25deg);
}

.c4{
    width:19%;
    height:32%;
    left:69%;
    top:58%;
    transform:rotate(-15deg);
}

.c5{
    width:31%;
    height:20%;
    left:17%;
    top:64%;
    transform:rotate(10deg);
}

.c6{
    width:13%;
    height:18%;
    left:48%;
    top:70%;
    transform:rotate(35deg);
}

@keyframes earthRotate{
    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}

/* atmósfera */

.earth-glow{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    pointer-events:none;

    border:
        2px solid
        rgba(130,210,255,.7);

    box-shadow:
        0 0 25px rgba(90,190,255,.7),
        0 0 55px rgba(80,130,255,.4);

    z-index:30;
}

/* =========================
   PALABRAS 3D
========================= */

#wordLayer{
    position:absolute;
    inset:0;

    transform-style:preserve-3d;

    pointer-events:none;

    z-index:40;
}

.word{
    position:absolute;

    left:50%;
    top:50%;

    white-space:nowrap;

    color:white;

    font-weight:bold;

    font-size:
        clamp(19px,5vw,42px);

    text-shadow:
        0 0 6px white,
        0 0 14px rgba(255,210,70,.9),
        0 0 30px rgba(190,80,255,.7);

    transform-style:preserve-3d;

    animation:
        flyWord
        7s
        ease-in-out
        forwards;
}

@keyframes flyWord{

    0%{
        opacity:0;

        transform:
            translate3d(
                calc(var(--x) - 50%),
                calc(var(--y) - 50%),
                -1000px
            )
            rotateX(var(--rx))
            rotateY(var(--ry))
            scale(.15);
    }

    15%{
        opacity:1;
    }

    48%{
        opacity:1;

        transform:
            translate3d(
                calc(var(--x) - 50%),
                calc(var(--y) - 50%),
                100px
            )
            rotateX(
                calc(var(--rx) + 90deg)
            )
            rotateY(
                calc(var(--ry) + 120deg)
            )
            scale(1.1);
    }

    78%{
        opacity:.8;
    }

    100%{
        opacity:0;

        transform:
            translate3d(
                calc(var(--x) - 50%),
                calc(var(--y) - 50%),
                900px
            )
            rotateX(
                calc(var(--rx) + 180deg)
            )
            rotateY(
                calc(var(--ry) + 270deg)
            )
            scale(1.5);
    }
}

/* =========================
   FLORES
========================= */

#flowers{
    position:absolute;
    inset:0;
    z-index:60;
    pointer-events:none;

    opacity:0;

    transition:opacity 2s ease;
}

#flowers.show{
    opacity:1;
}

.flower{
    position:absolute;

    bottom:-130px;

    width:90px;
    height:125px;

    transform-origin:center bottom;

    animation:
        flowerGrow
        3s
        forwards
        ease-out;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,210,0,.5)
        );
}

/* pétalos */

.petal{
    position:absolute;

    width:34px;
    height:55px;

    left:28px;
    top:0;

    border-radius:
        60% 60% 50% 50%;

    transform-origin:
        50% 100%;

    background:
        radial-gradient(
            ellipse at 50% 18%,
            #ffffb0 0%,
            #ffe72f 45%,
            #e6a500 100%
        );

    box-shadow:
        0 0 8px rgba(255,220,20,.8),
        0 0 18px rgba(255,190,0,.35);
}

.petal:nth-child(1){
    transform:rotate(0deg);
}

.petal:nth-child(2){
    transform:rotate(60deg);
}

.petal:nth-child(3){
    transform:rotate(120deg);
}

.petal:nth-child(4){
    transform:rotate(180deg);
}

.petal:nth-child(5){
    transform:rotate(240deg);
}

.petal:nth-child(6){
    transform:rotate(300deg);
}

/* centro */

.flower-center{
    position:absolute;

    width:30px;
    height:30px;

    left:30px;
    top:28px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff7a0,
            #d69a00 55%,
            #815000
        );

    box-shadow:
        0 0 8px #ffd000,
        0 0 20px rgba(255,200,0,.7);

    z-index:10;
}

/* tallo */

.stem{
    position:absolute;

    width:5px;
    height:90px;

    left:43px;
    top:52px;

    border-radius:10px;

    background:
        linear-gradient(
            to bottom,
            #76b84c,
            #244d20
        );

    z-index:-1;
}

.leaf{
    position:absolute;

    width:35px;
    height:17px;

    left:8px;
    top:83px;

    border-radius:
        100% 0 100% 0;

    background:
        linear-gradient(
            135deg,
            #76bd4c,
            #285321
        );

    transform:rotate(-25deg);
}

.leaf2{
    left:45px;
    top:96px;
    transform:rotate(30deg) scale(.9);
}

@keyframes flowerGrow{

    0%{
        transform:
            translateY(140px)
            scale(0)
            rotate(-12deg);

        opacity:0;
    }

    60%{
        transform:
            translateY(0)
            scale(1.12)
            rotate(5deg);

        opacity:1;
    }

    100%{
        transform:
            translateY(0)
            scale(1)
            rotate(0);

        opacity:1;
    }
}

/* =========================
   INDICACIÓN
========================= */

#hint{
    position:absolute;

    left:50%;
    bottom:7%;

    transform:translateX(-50%);

    color:rgba(255,255,255,.78);

    font-size:14px;

    letter-spacing:2px;

    white-space:nowrap;

    opacity:0;

    transition:opacity 2s;

    z-index:100;
}

#hint.show{
    opacity:1;
}

/* =========================
   MENSAJE FINAL
========================= */

#finalMessage{
    position:fixed;
    inset:0;

    z-index:200;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    opacity:0;

    transform:
        scale(.6)
        translateY(30px);

    transition:
        opacity 3s ease,
        transform 3s ease;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,.15),
            rgba(0,0,0,.55)
        );
}

#finalMessage.show{
    opacity:1;

    transform:
        scale(1)
        translateY(0);
}

.small{
    color:white;

    font-size:
        clamp(24px,6vw,38px);

    text-shadow:
        0 0 10px white,
        0 0 25px rgba(255,255,255,.6);
}

.name{
    color:#39ff14;

    font-size:
        clamp(55px,16vw,120px);

    font-weight:bold;

    letter-spacing:4px;

    text-shadow:
        0 0 6px #39ff14,
        0 0 18px #39ff14,
        0 0 35px #39ff14,
        0 0 70px rgba(57,255,20,.65);

    animation:greenGlow 2.5s infinite alternate;
}

.signature{
    margin-top:12px;

    color:#39ff14;

    font-size:
        clamp(23px,6vw,40px);

    letter-spacing:3px;

    text-shadow:
        0 0 7px #39ff14,
        0 0 18px #39ff14,
        0 0 35px rgba(57,255,20,.7);
}

@keyframes greenGlow{

    from{
        text-shadow:
            0 0 6px #39ff14,
            0 0 18px #39ff14,
            0 0 35px #39ff14;
    }

    to{
        text-shadow:
            0 0 10px #39ff14,
            0 0 28px #39ff14,
            0 0 55px #39ff14,
            0 0 90px rgba(57,255,20,.6);
    }
}

/* =========================
   MÚSICA
========================= */

#musicButton{
    position:fixed;

    right:18px;
    bottom:18px;

    z-index:300;

    width:52px;
    height:52px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.5);

    background:
        rgba(0,0,0,.5);

    color:white;

    font-size:22px;

    display:none;

    align-items:center;
    justify-content:center;

    backdrop-filter:blur(8px);

    box-shadow:
        0 0 15px rgba(255,255,255,.25);
}

#musicButton.show{
    display:flex;
}

/* =========================
   MÓVIL
========================= */

@media(max-width:600px){

    #earth{
        width:58vw;
        height:58vw;

        min-width:220px;
        min-height:220px;
    }

    .flower{
        transform:scale(.78);
    }

    .enter{
        font-size:44px;
    }

    #hint{
        font-size:11px;
    }

    .name{
        font-size:66px;
    }

    .signature{
        font-size:25px;
    }
}
</style>
</head>

<body>

<!-- =========================
     ENTRADA
========================= -->

<div id="start">
    <div class="enter">
        <span>TOCA</span>
        <span>Y</span>
        <span>ENTRA</span>
    </div>
</div>

<!-- =========================
     MÚSICA
========================= -->

<audio
    id="music"
    src="musica.mp3"
    loop
    preload="auto">
</audio>

<!-- =========================
     UNIVERSO
========================= -->

<div id="space">

    <div id="scene">

        <div class="nebula"></div>

        <div id="stars"></div>

        <!-- TIERRA -->

        <div id="earth">

            <div class="continent c1"></div>
            <div class="continent c2"></div>
            <div class="continent c3"></div>
            <div class="continent c4"></div>
            <div class="continent c5"></div>
            <div class="continent c6"></div>

            <div class="earth-glow"></div>

        </div>

        <!-- PALABRAS -->

        <div id="wordLayer"></div>

        <div id="hint">
            👆 MUEVE EL UNIVERSO CON TU DEDO
        </div>

    </div>

</div>

<!-- =========================
     FLORES
========================= -->

<div id="flowers"></div>

<!-- =========================
     FINAL
========================= -->

<div id="finalMessage">

    <div class="small">
        Para
    </div>

    <div class="name">
        BEATRIZ
    </div>

    <div class="signature">
        wălt stĕb
    </div>

</div>

<!-- =========================
     BOTÓN MÚSICA
========================= -->

<button
    id="musicButton"
    aria-label="Música">
    🔊
</button>


<script>

/* =========================
   ELEMENTOS
========================= */

const start =
    document.getElementById("start");

const space =
    document.getElementById("space");

const scene =
    document.getElementById("scene");

const stars =
    document.getElementById("stars");

const wordLayer =
    document.getElementById("wordLayer");

const flowers =
    document.getElementById("flowers");

const hint =
    document.getElementById("hint");

const finalMessage =
    document.getElementById("finalMessage");

const music =
    document.getElementById("music");

const musicButton =
    document.getElementById("musicButton");


/* =========================
   ESTRELLAS
========================= */

for(let i=0;i<330;i++){

    const star =
        document.createElement("div");

    star.className="star";

    const depth =
        -900 + Math.random()*1500;

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    const size =
        Math.random()*2.4+.4;

    star.style.width=size+"px";
    star.style.height=size+"px";

    star.style.transform =
        `translateZ(${depth}px)`;

    star.style.animationDuration =
        (1+Math.random()*4)+"s";

    star.style.animationDelay =
        Math.random()*4+"s";

    stars.appendChild(star);
}


/* =========================
   ESTRELLAS GRANDES
========================= */

for(let i=0;i<28;i++){

    const star =
        document.createElement("div");

    star.className="star-big";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    star.style.transform =
        `translateZ(${
            -800+Math.random()*1200
        }px)`;

    star.style.animationDelay =
        Math.random()*3+"s";

    stars.appendChild(star);
}


/* =========================
   FRASES
========================= */

const phrases=[

    "Te quiero ❤️",
    "Niña hermosa ✨",
    "Eres especial 🌻",
    "Qué bonita eres 💫",
    "Me encantas ❤️",
    "Para ti 🌻",
    "Un detalle para ti ✨",
    "Hermosa 💚",
    "Nunca dejes de sonreír ✨",
    "Beatriz ❤️",
    "Qué linda eres 🌻",
    "Tu sonrisa ✨",
    "Eres única 💫",
    "Una niña muy especial ❤️",
    "Para una hermosa niña 🌻",
    "Sonríe siempre 😊",
    "Qué bonito conocerte ✨",
    "Un pequeño detalle para ti 💛",
    "Espero que te guste 🌻",
    "Eres increíble 💫",
    "Bonita ❤️",
    "Hermosa sonrisa ✨",
    "Para Beatriz 🌻",
    "Con cariño 💛",
    "Nunca cambies ✨",
    "Qué hermosa eres ❤️",
    "Un detalle hecho para ti 🌻",
    "Especial 💚",
    "Linda niña ✨",
    "Que tengas un bonito día 🌻"

];

let wordTimer;


/* =========================
   CREAR PALABRA
========================= */

function createWord(){

    const word =
        document.createElement("div");

    word.className="word";

    word.textContent =
        phrases[
            Math.floor(
                Math.random()*phrases.length
            )
        ];

    word.style.setProperty(
        "--x",
        (5+Math.random()*90)+"vw"
    );

    word.style.setProperty(
        "--y",
        (8+Math.random()*84)+"vh"
    );

    word.style.setProperty(
        "--rx",
        (-40+Math.random()*80)+"deg"
    );

    word.style.setProperty(
        "--ry",
        (-50+Math.random()*100)+"deg"
    );

    word.style.animationDelay =
        Math.random()*.8+"s";

    wordLayer.appendChild(word);

    setTimeout(
        ()=>{
            word.remove();
        },
        7800
    );
}


/* =========================
   INICIAR PALABRAS
========================= */

function startWords(){

    for(let i=0;i<8;i++){

        setTimeout(
            createWord,
            i*500
        );
    }

    wordTimer =
        setInterval(
            createWord,
            900
        );
}


/* =========================
   FLORES
========================= */

const flowerPositions=[

    2,7,12,18,25,
    32,39,46,53,60,
    67,74,81,88,94,
    15,35,55,75,90,
    5,28,48,70,84

];


function createFlower(index){

    const flower =
        document.createElement("div");

    flower.className="flower";

    flower.style.left =
        flowerPositions[index]+"%";

    flower.style.animationDelay =
        (index*.12)+"s";

    /* pétalos */

    for(let i=0;i<6;i++){

        const petal =
            document.createElement("div");

        petal.className="petal";

        flower.appendChild(petal);
    }

    /* centro */

    const center =
        document.createElement("div");

    center.className=
        "flower-center";

    flower.appendChild(center);

    /* tallo */

    const stem =
        document.createElement("div");

    stem.className="stem";

    flower.appendChild(stem);

    /* hojas */

    const leaf =
        document.createElement("div");

    leaf.className="leaf";

    flower.appendChild(leaf);

    const leaf2 =
        document.createElement("div");

    leaf2.className="leaf leaf2";

    flower.appendChild(leaf2);

    flowers.appendChild(flower);
}


for(let i=0;i<flowerPositions.length;i++){

    createFlower(i);

}


/* =========================
   ESTADO
========================= */

let started=false;

let musicPlaying=false;


/* =========================
   CÁMARA
========================= */

let rotX=0;
let rotY=0;

let lastX=0;
let lastY=0;

let dragging=false;

let scale=1;

let pinchStart=0;


/* =========================
   APLICAR CÁMARA
========================= */

function applyCamera(){

    scene.style.transform=

        `rotateX(${rotX}deg)
         rotateY(${rotY}deg)
         scale(${scale})`;

}


/* =========================
   INICIAR EXPERIENCIA
========================= */

function startExperience(){

    if(started) return;

    started=true;

    /* música */

    music.volume=.55;

    music.play()
        .then(()=>{

            musicPlaying=true;

            musicButton.textContent="🔊";

        })
        .catch(()=>{

            musicPlaying=false;

        });


    /* ocultar entrada */

    start.classList.add("hidden");


    /* mostrar universo */

    setTimeout(()=>{

        space.classList.add("show");

        startWords();

        hint.classList.add("show");

    },500);


    /* quitar indicación */

    setTimeout(()=>{

        hint.classList.remove("show");

    },5500);


    /* flores */

    setTimeout(()=>{

        flowers.classList.add("show");

    },9000);


    /* final */

    setTimeout(()=>{

        finalMessage.classList.add("show");

        musicButton.classList.add("show");

        clearInterval(wordTimer);

    },14500);

}


/* =========================
   ENTRADA
========================= */

start.addEventListener(
    "click",
    startExperience
);

start.addEventListener(
    "pointerdown",
    ()=>{

        if(!started){

            music.volume=.55;

            music.play()
                .catch(()=>{});

        }

    }
);


/* =========================
   MOVER UNIVERSO
========================= */

scene.addEventListener(
    "pointerdown",
    event=>{

        if(!started) return;

        dragging=true;

        lastX=event.clientX;
        lastY=event.clientY;

    }
);


window.addEventListener(
    "pointermove",
    event=>{

        if(
            !dragging ||
            !started
        ){
            return;
        }

        const dx =
            event.clientX-lastX;

        const dy =
            event.clientY-lastY;

        rotY += dx*.32;

        rotX -= dy*.32;

        rotX =
            Math.max(
                -75,
                Math.min(
                    75,
                    rotX
                )
            );

        applyCamera();

        lastX=event.clientX;
        lastY=event.clientY;

    }
);


window.addEventListener(
    "pointerup",
    ()=>{

        dragging=false;

    }
);


/* =========================
   ZOOM
========================= */

scene.addEventListener(
    "touchstart",
    event=>{

        if(event.touches.length===2){

            pinchStart =
                Math.hypot(

                    event.touches[0].clientX-
                    event.touches[1].clientX,

                    event.touches[0].clientY-
                    event.touches[1].clientY

                );
        }

    },
    {passive:true}
);


scene.addEventListener(
    "touchmove",
    event=>{

        if(
            event.touches.length===2 &&
            pinchStart
        ){

            const distance =
                Math.hypot(

                    event.touches[0].clientX-
                    event.touches[1].clientX,

                    event.touches[0].clientY-
                    event.touches[1].clientY

                );

            scale *=
                distance/pinchStart;

            scale =
                Math.max(
                    .65,
                    Math.min(
                        1.8,
                        scale
                    )
                );

            pinchStart=distance;

            applyCamera();

        }

    },
    {passive:true}
);


scene.addEventListener(
    "touchend",
    ()=>{
        pinchStart=0;
    },
    {passive:true}
);


/* =========================
   MÚSICA
========================= */

musicButton.addEventListener(
    "click",
    ()=>{

        if(musicPlaying){

            music.pause();

            musicPlaying=false;

            musicButton.textContent="🔇";

        }

        else{

            music.play()
                .then(()=>{

                    musicPlaying=true;

                    musicButton.textContent="🔊";

                })
                .catch(()=>{});

        }

    }
);

</script>
